<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 820 254" width="820" height="254" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Marginal Land Solar</title>
<desc>Section through a farm field. The level, well drained ground on the left stays in crop. The array stands in the wet, stony corner that never paid its way, under rough grass with shallow roots, where the water table rises close to the surface. Its SCALE footprint sits at the right: Communities close to the center, the other three mid-scale.</desc>

<defs>
  <!-- shared glyphs: the module, person, and crop are identical in every archetype card.
       Post height is drawn per instance, because clearance is a real design variable. -->
  <g id="module">
    <line x1="-9" y1="16" x2="9" y2="8" stroke="#6b6b63" stroke-width="1.4"/>
    <polygon points="-22,9 22,-9 22,-5 -22,13" fill="#5b6b7a" stroke="#3d4a55" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <g id="person">
    <circle cx="0" cy="-22.5" r="3.6" fill="none" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="0" y1="-19" x2="0" y2="-9" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="-4.5" y1="-15" x2="4.5" y2="-15" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="0" y1="-9" x2="-4" y2="0" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="0" y1="-9" x2="4" y2="0" stroke="#3d3a34" stroke-width="1.6"/>
  </g>
  <g id="crop">
    <line x1="0" y1="0" x2="0" y2="-9" stroke="#6a9440" stroke-width="1.5"/>
    <line x1="0" y1="-5" x2="-3.5" y2="-9" stroke="#6a9440" stroke-width="1.2"/>
    <line x1="0" y1="-5" x2="3.5" y2="-9" stroke="#6a9440" stroke-width="1.2"/>
  </g>
  <g id="tuft">
    <line x1="0" y1="0" x2="-3" y2="-7" stroke="#8a9464" stroke-width="1.3"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="#8a9464" stroke-width="1.3"/>
    <line x1="0" y1="0" x2="3" y2="-7" stroke="#8a9464" stroke-width="1.3"/>
  </g>
  <clipPath id="soilclip">
    <path d="M26,172 L170,172 L230,204 L512,208 L545,196 L545,250 L26,250 Z"/>
  </clipPath>
</defs>

<rect y="14" width="820" height="254" rx="10" fill="#ffffff" stroke="#e6e1d6"/>

<text x="26" y="32" fill="#777" font-size="11">A2–A3 · S4 · siting-led</text>

<!-- ================= soil ================= -->
<path d="M26,172 L170,172 L230,204 L512,208 L545,196 L545,250 L26,250 Z" fill="#f2ece0"/>
<g clip-path="url(#soilclip)">
  <!-- topsoil: deep and even under the field, thin under the corner -->
  <path d="M26,172 L170,172 L230,204 L512,208 L545,196 L545,206 L512,218 L230,214 L170,186 L26,186 Z" fill="#e0d5bd"/>
  <!-- stone in the corner -->
  <path d="M282,230 l14,-6 l13,5 l-4,11 l-16,2 z" fill="#c6b99c" stroke="#a89a79" stroke-width="1"/>
  <path d="M372,242 l17,-5 l12,7 l-9,9 l-17,-2 z" fill="#c6b99c" stroke="#a89a79" stroke-width="1"/>
  <path d="M444,228 l11,-5 l10,6 l-6,8 l-13,-1 z" fill="#c6b99c" stroke="#a89a79" stroke-width="1"/>
  <path d="M498,240 l12,-4 l9,6 l-6,8 l-14,-2 z" fill="#c6b99c" stroke="#a89a79" stroke-width="1"/>
  <!-- water table, rising into the hollow -->
  <path d="M26,246 L180,244 L250,232 L520,230 L545,234" fill="none" stroke="#2b7fb0" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.75"/>
</g>
<path d="M26,172 L170,172 L230,204 L512,208 L545,196" fill="none" stroke="#8a7f6a" stroke-width="1.8"/>

<!-- ================= the field that keeps farming ================= -->
<g>
  <use href="#crop" x="44" y="172"/><use href="#crop" x="66" y="172"/><use href="#crop" x="88" y="172"/>
  <use href="#crop" x="110" y="172"/><use href="#crop" x="132" y="172"/><use href="#crop" x="154" y="172"/>
</g>
<g stroke="#b6a274" stroke-width="1" opacity="0.85">
  <path d="M44,172 v9"/><path d="M88,172 v9"/><path d="M132,172 v9"/>
</g>

<!-- ================= the corner that never paid ================= -->
<g>
  <use href="#tuft" x="244" y="204.2"/><use href="#tuft" x="268" y="204.5"/><use href="#tuft" x="292" y="204.9"/>
  <use href="#tuft" x="316" y="205.2"/><use href="#tuft" x="340" y="205.6"/><use href="#tuft" x="364" y="205.9"/>
  <use href="#tuft" x="388" y="206.2"/><use href="#tuft" x="412" y="206.6"/><use href="#tuft" x="436" y="206.9"/>
  <use href="#tuft" x="460" y="207.3"/><use href="#tuft" x="484" y="207.6"/><use href="#tuft" x="508" y="207.9"/>
</g>
<g stroke="#b6a274" stroke-width="1" opacity="0.85">
  <path d="M244,204.2 v6"/><path d="M292,204.9 v6"/><path d="M340,205.6 v6"/>
  <path d="M388,206.2 v6"/><path d="M436,206.9 v6"/><path d="M484,207.6 v6"/>
</g>
<ellipse cx="400" cy="206.5" rx="60" ry="3.4" fill="#2b7fb0" opacity="0.28"/>

<line x1="285" y1="204.8" x2="285" y2="172.8" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" x="285" y="172.8"/>
<line x1="350" y1="205.7" x2="350" y2="173.7" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" x="350" y="173.7"/>
<line x1="415" y1="206.6" x2="415" y2="174.6" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" x="415" y="174.6"/>
<line x1="480" y1="207.5" x2="480" y2="175.5" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" x="480" y="175.5"/>
<use href="#person" x="248" y="204.3"/>

<path d="M196,186 v-22" stroke="#a89c80" stroke-width="1.2" stroke-dasharray="3 3"/>

<text x="98" y="150" fill="#6a7a52" font-size="11" font-style="italic" text-anchor="middle">still cropped</text>
<text x="380" y="154" fill="#8a7f6a" font-size="11" font-style="italic" text-anchor="middle">ground that never paid its way</text>

<!-- ================= SCALE footprint ================= -->
<line x1="572" y1="62" x2="572" y2="242" stroke="#ece7db" stroke-width="1"/>

<polygon points="690,132 708,150 690,168 672,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<polygon points="690,114 726,150 690,186 654,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<polygon points="690,96 744,150 690,204 636,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="96" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="744" y2="150" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="204" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="636" y2="150" stroke="#d8d2c4" stroke-width="1"/>

<text x="690" y="85" fill="#6f4a9c" font-size="10.5" font-weight="600" text-anchor="middle">Communities</text>
<text x="752" y="150" fill="#3f8f36" font-size="10.5" font-weight="600" text-anchor="start" dominant-baseline="middle">Agriculture</text>
<text x="690" y="218" fill="#c08a12" font-size="10.5" font-weight="600" text-anchor="middle">Energy</text>
<text x="628" y="150" fill="#2b7fb0" font-size="10.5" font-weight="600" text-anchor="end" dominant-baseline="middle">Landscapes</text>

<polygon points="690,145.2 711.0,150 690,176.4 666.3,150" fill="#3b6ea5" fill-opacity="0.18" stroke="#3b6ea5" stroke-width="1.8"/>
<circle cx="690" cy="145.2" r="2.2" fill="#2c5580"/>
<circle cx="711.0" cy="150" r="2.2" fill="#2c5580"/>
<circle cx="690" cy="176.4" r="2.2" fill="#2c5580"/>
<circle cx="666.3" cy="150" r="2.2" fill="#2c5580"/>

<text x="690" y="238" fill="#7a7973" font-size="10" font-style="italic" text-anchor="middle">regeneration at the center</text>
</svg>
