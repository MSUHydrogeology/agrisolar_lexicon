<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660" role="img" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title>The lexicon vocabulary anchored across two scales — a parcel plan and an array section — with restorative functions in color</title>
<desc>A two-panel landscape-architecture plate. Top: parcel-scale plan, siting-led restoration, with footprint nested in an asymmetric influence zone, screening, hydrology, viewshed, community benefit and fragmentation. Bottom: array-scale section, structure- and management-led restoration, with module technology, pore space, inter-row, tracking, ground layer, microclimate and the integration couplings. Five restorative functions are color-coded and keyed.</desc>
<style>
.h1{font-size:15px;font-weight:700;fill:#34402f}
.h2{font-size:10px;fill:#8a8880}
.pl{font-size:11px;font-weight:700;fill:#5f7050;letter-spacing:0.6px}
.pd{font-size:9.5px;font-style:italic;fill:#8a8880}
.tt{font-size:11.5px;font-weight:600;fill:#3a4534}
.td{font-size:9.5px;font-style:italic;fill:#7a7973}
.cp{font-size:10px;fill:#8a8880}
.dim{stroke:#a7a59c;stroke-width:1;fill:none}
.frame{fill:none;stroke:#dcd7ca;stroke-width:1.2}
.fk{font-size:10.5px;font-weight:700}
.fH{fill:#2f77bf}.fS{fill:#8a5a2b}.fB{fill:#4e8a3f}.fM{fill:#2f8f9a}.fC{fill:#c8871f}
.fH{fill:#6aa6e0}.fS{fill:#bd9161}.fB{fill:#82bd70}.fM{fill:#5fb8c0}.fC{fill:#e0b45a}}
</style>

<text class="h1" x="30" y="28">Anchoring the vocabulary — the lexicon across two scales</text>
<text class="h2" x="30" y="43">structure terms in charcoal · restorative functions in color · footprint is the shared anchor</text>

