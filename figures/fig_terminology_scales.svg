<svg xmlns="http://www.w3.org/2000/svg" width="1106" height="696" viewBox="0 0 1106 696" role="img">
<title>Where the spatial vocabulary lives</title>
<desc>Two panels. Above, a parcel in plan: a block of array rows labelled the footprint, spanning two holdings whose shared boundary is labelled land assembly; a hedgerow along the near edge labelled screening, running out to a woodlot labelled connectivity; a larger and lopsided dashed outline reaching past the parcel toward a watercourse, labelled the influence zone; a hatched patch of poor ground in one corner labelled marginal land; and a line from the array to a substation off the parcel, labelled interconnection. Below, five rows of one array in section standing on a ground layer over soil, with a dashed original ground surface beneath labelled mass grading, and labels for the clearance under the lowest panel edge, the flock under the first row, the spacing between rows, the tracking that turns the second, the ground the third covers, the pore space the fourth leaves beneath it, the racking that carries them, and a fifth row standing vertically to show module technology.</desc>
