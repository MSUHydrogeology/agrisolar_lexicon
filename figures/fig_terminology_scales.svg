<svg xmlns="http://www.w3.org/2000/svg" width="1106" height="654" viewBox="0 0 1106 654" role="img">
<title>Where the spatial vocabulary lives</title>
<desc>Two panels. The upper panel is a parcel seen in plan: a block of array rows labelled the footprint, a hedgerow along its near edge labelled screening, a larger and lopsided dashed outline reaching past the parcel toward a watercourse and a dwelling labelled the influence zone, and a hatched patch of poor ground in one corner labelled marginal land. The lower panel is four rows of one array seen in section, standing on a ground layer over soil, labelled for the clearance under the lowest panel edge, the spacing between rows, the ground each row covers, the pore space between panels and ground, the racking that carries them, the module itself, and the tracking that turns it.</desc>
