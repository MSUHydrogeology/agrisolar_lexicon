<rect x="112" y="266" width="578" height="26" rx="4" fill="#f2f1ec" stroke="#c9c6bc" stroke-width="1" stroke-dasharray="4 3"/>
<text class="pl" x="126" y="284">ownership · contracts</text>
<text class="nt" x="676" y="284" text-anchor="end">full range at every zone</text>
<text class="nt" x="112" y="314">The three curves act on ground, and scale rations them. The two on paper are a flat band because scale changes</text>
<text class="nt" x="112" y="330">their form and not their strength. Ownership is the exception that moves rather than narrows, from operator to utility.</text>
</svg>
