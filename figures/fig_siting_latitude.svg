<svg xmlns="http://www.w3.org/2000/svg" width="880" height="368" viewBox="0 0 880 368" role="img">
<title>What scale leaves of each design lever</title>
<desc>Three curves across the five zones. Structure starts highest at A1, where an array can be built to fit a particular yard, and falls to commodity racking at A5. Siting latitude is low at A1, peaks at A3, and falls away by A5 as land assembly and the interconnection queue take the choice. Management is nearly nothing at A1 and rises to carry everything at A4 and A5. Siting and management cross between A3 and A4, which is where the dominant restoration mode changes. Below the plot, a flat band shows ownership and contracts holding full range at every zone, because they act on paper rather than on ground and scale does not ration them.</desc>
