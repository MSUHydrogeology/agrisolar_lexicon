<text class="nt" x="460" y="22" text-anchor="middle">siting hands off to management</text>
<text class="nt" x="398" y="204" text-anchor="middle">ownership hands off to contracts</text>
<text class="zl" x="112" y="362" text-anchor="middle">A1</text>
<text class="zl" x="251" y="362" text-anchor="middle">A2</text>
<text class="zl" x="390" y="362" text-anchor="middle">A3</text>
<text class="zl" x="529" y="362" text-anchor="middle">A4</text>
<text class="zl" x="668" y="362" text-anchor="middle">A5</text>
<text class="nt" x="112" y="394">Two hand-offs, not one. The alignment an owner-operator supplies for nothing, because they own both the array and the animals under it,</text>
<text class="nt" x="112" y="410">has to be written down clause by clause once the owner is a developer in another state. Scale is the axis, so it has no curve of its own.</text>
