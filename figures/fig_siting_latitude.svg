<text class="cl" x="680" y="336" fill="#8a6ba8">ownership</text>
<text class="nt" x="390" y="22" text-anchor="middle">siting hands off to management</text>
<text class="nt" x="390" y="204" text-anchor="middle">ownership hands off to contracts</text>
<text class="zl" x="112" y="362" text-anchor="middle" >A1</text>
<text class="zl" x="251" y="362" text-anchor="middle" >A2</text>
<text class="zl" x="390" y="362" text-anchor="middle" font-size="14.5px">A3</text>
<text class="zl" x="529" y="362" text-anchor="middle" >A4</text>
<text class="zl" x="668" y="362" text-anchor="middle" >A5</text>
<text class="nt" x="112" y="394">Two hand-offs, and both fall at A3. Below it a project restores by choosing ground and by who owns it; above it by how the place is run</text>
<text class="nt" x="112" y="410">and by what the parties signed. Scale is the axis, so it has no curve of its own.</text>
