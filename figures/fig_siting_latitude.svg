<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img">
<title>What scale leaves of each design lever</title>
<desc>Two panels over the same five zones. The upper panel holds the three levers that act on ground. Structure starts highest at A1, where an array can be built to fit one particular yard, and falls to commodity racking at A5. Siting is low at A1, peaks at A3, and falls away by A5 as land assembly and the interconnection queue take the choice. Management is nearly nothing at A1 and rises to carry everything at A4 and A5. Siting and management cross between A3 and A4. The lower panel holds the two levers that act on paper. Ownership starts highest at A1, where the operator owns both the array and the animals under it and no agreement is needed, and falls to almost nothing at A5, where the owner is absentee. Contracts run the opposite way, close to nothing at A1 because there is no counterparty to write to, and the main instrument by A5. The two cross near A3. Scale is the axis and has no curve of its own.</desc>
