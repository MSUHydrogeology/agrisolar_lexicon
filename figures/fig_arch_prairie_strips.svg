<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 820 254" width="820" height="254" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Solar Prairie Strips</title>
<desc>Section through a sloping crop field. The array stands mid-slope on a contour band of deep-rooted native prairie, raised clear of the standing vegetation. The band intercepts runoff coming down the hill, traps sediment at its upslope edge, and carries roots far below the crop rooting depth so water moves downward instead of across. Flow leaving the strip is reduced. Its SCALE footprint sits at the right: Landscapes almost at the center, Agriculture out toward the rim.</desc>

<defs>
  <!-- shared glyphs: the module, person, and crop are identical in every archetype card.
       Post height is drawn per instance, because clearance is a real design variable. -->
  <g id="module">
    <line x1="-9" y1="16" x2="9" y2="8" stroke="#6b6b63" stroke-width="1.4"/>
    <polygon points="-22,9 22,-9 22,-5 -22,13" fill="#5b6b7a" stroke="#3d4a55" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <g id="person">
    <circle cx="0" cy="-22.5" r="3.6" fill="none" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="0" y1="-19" x2="0" y2="-9" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="-4.5" y1="-15" x2="4.5" y2="-15" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="0" y1="-9" x2="-4" y2="0" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="0" y1="-9" x2="4" y2="0" stroke="#3d3a34" stroke-width="1.6"/>
  </g>
  <g id="crop">
    <line x1="0" y1="0" x2="0" y2="-9" stroke="#6a9440" stroke-width="1.5"/>
    <line x1="0" y1="-5" x2="-3.5" y2="-9" stroke="#6a9440" stroke-width="1.2"/>
    <line x1="0" y1="-5" x2="3.5" y2="-9" stroke="#6a9440" stroke-width="1.2"/>
  </g>
  <g id="prairie">
    <line x1="0" y1="0" x2="0" y2="-15" stroke="#4f7a34" stroke-width="1.6"/>
    <line x1="0" y1="-5" x2="-5" y2="-12" stroke="#4f7a34" stroke-width="1.3"/>
    <line x1="0" y1="-5" x2="5" y2="-12" stroke="#4f7a34" stroke-width="1.3"/>
    <line x1="0" y1="-10" x2="-3.5" y2="-17" stroke="#4f7a34" stroke-width="1.2"/>
    <line x1="0" y1="-10" x2="3.5" y2="-17" stroke="#4f7a34" stroke-width="1.2"/>
    <circle cx="0" cy="-16.5" r="1.6" fill="#4f7a34"/>
  </g>
  <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,1.5 L9,5 L0,8.5 z" fill="#2b7fb0"/>
  </marker>
  <clipPath id="soilclip2">
    <path d="M26,140 L150,162 L300,192 L430,212 L545,224 L545,252 L26,252 Z"/>
  </clipPath>
</defs>

<rect y="14" width="820" height="254" rx="10" fill="#ffffff" stroke="#e6e1d6"/>

<text x="26" y="32" fill="#777" font-size="11">A3 · S5 · siting-led</text>

<!-- ================= soil ================= -->
<path d="M26,140 L150,162 L300,192 L430,212 L545,224 L545,252 L26,252 Z" fill="#f2ece0"/>
<g clip-path="url(#soilclip2)">
  <path d="M26,140 L150,162 L300,192 L430,212 L545,224 L545,238 L430,226 L300,206 L150,176 L26,154 Z" fill="#e0d5bd"/>
  <!-- deep prairie roots, well past the crop rooting depth -->
  <g fill="none" stroke="#8a6f43" stroke-width="1.2" opacity="0.9">
    <path d="M272,186 C269,202 275,216 270,240"/>
    <path d="M294,191 C298,206 291,220 296,244"/>
    <path d="M316,194 C312,210 319,224 314,246"/>
    <path d="M338,198 C342,212 335,228 340,248"/>
    <path d="M360,201 C356,216 363,230 358,249"/>
    <path d="M382,205 C386,220 379,234 384,250"/>
    <path d="M404,208 C400,222 407,236 402,250"/>
    <path d="M424,211 C428,225 421,238 426,250"/>
  </g>
  <g fill="none" stroke="#8a6f43" stroke-width="0.8" opacity="0.6">
    <path d="M272,208 l-10,7"/><path d="M296,214 l10,6"/><path d="M315,220 l-10,6"/>
    <path d="M360,222 l10,7"/><path d="M383,228 l-10,5"/><path d="M404,230 l9,6"/>
  </g>
  <!-- water going down under the strip instead of across the surface -->
  <g stroke="#2b7fb0" stroke-width="1.3" opacity="0.75" marker-end="url(#flow)">
    <path d="M300,202 v16"/><path d="M350,210 v16"/><path d="M400,218 v16"/>
  </g>
</g>
<path d="M26,140 L150,162 L300,192 L430,212 L545,224" fill="none" stroke="#8a7f6a" stroke-width="1.8"/>

<!-- ================= crop above and below the strip ================= -->
<g>
  <use href="#crop" x="44" y="143.2"/><use href="#crop" x="66" y="147.1"/><use href="#crop" x="88" y="151.0"/>
  <use href="#crop" x="110" y="154.9"/><use href="#crop" x="132" y="158.8"/><use href="#crop" x="154" y="162.8"/>
  <use href="#crop" x="176" y="167.2"/><use href="#crop" x="198" y="171.6"/><use href="#crop" x="220" y="176.0"/>
  <use href="#crop" x="474" y="216.6"/><use href="#crop" x="496" y="218.9"/><use href="#crop" x="518" y="221.2"/>
</g>
<g stroke="#b6a274" stroke-width="1" opacity="0.85">
  <path d="M44,143.2 v9"/><path d="M88,151.0 v9"/><path d="M132,158.8 v9"/><path d="M176,167.2 v9"/><path d="M220,176.0 v9"/>
  <path d="M496,218.9 v9"/>
</g>

<!-- ================= runoff coming down the hill ================= -->
<g stroke="#2b7fb0" stroke-width="1.6" fill="none" marker-end="url(#flow)" opacity="0.85">
  <path d="M150,144 L205,155"/>
  <path d="M192,154 L247,165"/>
</g>
<text x="144" y="140" fill="#2b7fb0" font-size="11" font-style="italic" text-anchor="end">runoff</text>

<!-- what leaves the strip, reduced -->
<g stroke="#2b7fb0" stroke-width="0.9" fill="none" marker-end="url(#flow)" opacity="0.65">
  <path d="M470,201 L512,205"/>
</g>

<!-- sediment caught at the upslope edge -->
<polygon points="248,181.4 272,186.4 266,174" fill="#d6c9ab" stroke="#a89a79" stroke-width="1.1"/>

<!-- ================= the contour band ================= -->
<g>
  <use href="#prairie" x="272" y="186.4"/><use href="#prairie" x="294" y="190.8"/><use href="#prairie" x="316" y="194.5"/>
  <use href="#prairie" x="338" y="197.8"/><use href="#prairie" x="360" y="201.2"/><use href="#prairie" x="382" y="204.6"/>
  <use href="#prairie" x="404" y="208.0"/><use href="#prairie" x="424" y="211.1"/>
</g>

<!-- raised clear of the standing prairie -->
<line x1="300" y1="192" x2="300" y2="154" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" x="300" y="154"/>
<line x1="355" y1="200.5" x2="355" y2="162.5" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" x="355" y="162.5"/>
<line x1="410" y1="208.9" x2="410" y2="170.9" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" x="410" y="170.9"/>
<use href="#person" x="452" y="214.3"/>

<text x="348" y="128" fill="#4f7a34" font-size="11" font-style="italic" text-anchor="middle">deep-rooted prairie, on the contour</text>

<!-- ================= SCALE footprint ================= -->
<line x1="572" y1="62" x2="572" y2="242" stroke="#ece7db" stroke-width="1"/>

<polygon points="690,132 708,150 690,168 672,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<polygon points="690,114 726,150 690,186 654,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<polygon points="690,96 744,150 690,204 636,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="96" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="744" y2="150" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="204" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="636" y2="150" stroke="#d8d2c4" stroke-width="1"/>

<text x="690" y="85" fill="#6f4a9c" font-size="10.5" font-weight="600" text-anchor="middle">Communities</text>
<text x="752" y="150" fill="#3f8f36" font-size="10.5" font-weight="600" text-anchor="start" dominant-baseline="middle">Agriculture</text>
<text x="690" y="218" fill="#c08a12" font-size="10.5" font-weight="600" text-anchor="middle">Energy</text>
<text x="628" y="150" fill="#2b7fb0" font-size="10.5" font-weight="600" text-anchor="end" dominant-baseline="middle">Landscapes</text>

<polygon points="690,134.3 721.9,150 690,176.4 687.9,150" fill="#3b6ea5" fill-opacity="0.18" stroke="#3b6ea5" stroke-width="1.8"/>
<circle cx="690" cy="134.3" r="2.2" fill="#2c5580"/>
<circle cx="721.9" cy="150" r="2.2" fill="#2c5580"/>
<circle cx="690" cy="176.4" r="2.2" fill="#2c5580"/>
<circle cx="687.9" cy="150" r="2.2" fill="#2c5580"/>

<text x="690" y="238" fill="#7a7973" font-size="10" font-style="italic" text-anchor="middle">regeneration at the center</text>
</svg>
