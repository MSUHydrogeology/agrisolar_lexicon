<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 820 254" width="820" height="254" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Barnyard Shelter Solar</title>
<desc>Section through a farmyard. A small array stands over the paddock the herd already uses, raised high enough for cattle to walk beneath, with a cable running back to the barn it offsets. Beneath the shaded ground the soil is compacted where the animals crowd, the tradeoff this archetype carries. Its SCALE footprint sits at the right: Agriculture nearest the center, Energy out toward the rim.</desc>

<defs>
  <!-- shared glyphs: the module, person, and crop are identical in every archetype card.
       Post height is drawn per instance, because clearance is a real design variable. -->
  <g id="module">
    <line x1="-9" y1="16" x2="9" y2="8" stroke="#6b6b63" stroke-width="1.4"/>
    <polygon points="-22,9 22,-9 22,-5 -22,13" fill="#5b6b7a" stroke="#3d4a55" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <g id="person">
    <circle cx="0" cy="-22.5" r="3.6" fill="none" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="0" y1="-19" x2="0" y2="-9" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="-4.5" y1="-15" x2="4.5" y2="-15" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="0" y1="-9" x2="-4" y2="0" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="0" y1="-9" x2="4" y2="0" stroke="#3d3a34" stroke-width="1.6"/>
  </g>
  <g id="cow">
    <rect x="-16" y="-22" width="32" height="13" rx="5" fill="#ffffff" stroke="#3d3a34" stroke-width="1.5"/>
    <path d="M16,-20 q8,-1 9,3 q1,4 -3,5 l-6,0" fill="#ffffff" stroke="#3d3a34" stroke-width="1.4"/>
    <line x1="-11" y1="-9" x2="-11" y2="0" stroke="#3d3a34" stroke-width="1.4"/>
    <line x1="-4" y1="-9" x2="-4" y2="0" stroke="#3d3a34" stroke-width="1.4"/>
    <line x1="7" y1="-9" x2="7" y2="0" stroke="#3d3a34" stroke-width="1.4"/>
    <line x1="13" y1="-9" x2="13" y2="0" stroke="#3d3a34" stroke-width="1.4"/>
    <path d="M-16,-20 q-5,3 -3,9" fill="none" stroke="#3d3a34" stroke-width="1.2"/>
  </g>
  <g id="tuft">
    <line x1="0" y1="0" x2="-3" y2="-7" stroke="#8a9464" stroke-width="1.3"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="#8a9464" stroke-width="1.3"/>
    <line x1="0" y1="0" x2="3" y2="-7" stroke="#8a9464" stroke-width="1.3"/>
  </g>
  <clipPath id="soilclipB">
    <path d="M26,200 L545,200 L545,250 L26,250 Z"/>
  </clipPath>
</defs>

<rect y="14" width="820" height="254" rx="10" fill="#ffffff" stroke="#e6e1d6"/>

<text x="26" y="32" fill="#777" font-size="11">A1 · S1–S2 · management-led</text>

<!-- ================= soil ================= -->
<path d="M26,200 L545,200 L545,250 L26,250 Z" fill="#f2ece0"/>
<g clip-path="url(#soilclipB)">
  <path d="M26,200 L545,200 L545,214 L26,214 Z" fill="#e0d5bd"/>
  <!-- compacted, poached ground where the herd crowds into the shade -->
  <path d="M264,200 L456,200 L456,219 L264,219 Z" fill="#c9bb9c"/>
  <g fill="#a89a79" opacity="0.85">
    <circle cx="278" cy="207" r="1.1"/><circle cx="296" cy="212" r="1.1"/><circle cx="312" cy="205" r="1.1"/>
    <circle cx="330" cy="213" r="1.1"/><circle cx="348" cy="207" r="1.1"/><circle cx="366" cy="212" r="1.1"/>
    <circle cx="384" cy="205" r="1.1"/><circle cx="402" cy="213" r="1.1"/><circle cx="420" cy="208" r="1.1"/>
    <circle cx="438" cy="212" r="1.1"/><circle cx="288" cy="216" r="1.1"/><circle cx="356" cy="216" r="1.1"/>
    <circle cx="412" cy="216" r="1.1"/>
  </g>
</g>
<path d="M26,200 L545,200" fill="none" stroke="#8a7f6a" stroke-width="1.8"/>

<!-- ================= the barn ================= -->
<polygon points="58,200 58,156 106,128 154,156 154,200" fill="#ffffff" stroke="#6b6b63" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M58,156 L106,128 L154,156" fill="none" stroke="#6b6b63" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="92" y="170" width="28" height="30" fill="none" stroke="#6b6b63" stroke-width="1.4"/>
<line x1="106" y1="170" x2="106" y2="200" stroke="#6b6b63" stroke-width="1.1"/>

<!-- the cable back to the load it offsets -->
<path d="M284,178 L200,178 L160,178" fill="none" stroke="#c08a12" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="160" cy="178" r="3" fill="none" stroke="#c08a12" stroke-width="1.3"/>

<!-- ================= yard cover, thin where they stand ================= -->
<g>
  <use href="#tuft" x="176" y="200"/><use href="#tuft" x="200" y="200"/><use href="#tuft" x="224" y="200"/>
  <use href="#tuft" x="248" y="200"/>
  <use href="#tuft" x="474" y="200"/><use href="#tuft" x="498" y="200"/><use href="#tuft" x="522" y="200"/>
</g>
<g stroke="#b6a274" stroke-width="1" opacity="0.85">
  <path d="M176,200 v7"/><path d="M224,200 v7"/><path d="M498,200 v7"/>
</g>

<!-- ================= the array over the paddock ================= -->
<line x1="284" y1="200" x2="284" y2="154" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" x="284" y="154"/>
<line x1="352" y1="200" x2="352" y2="154" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" x="352" y="154"/>
<line x1="420" y1="200" x2="420" y2="154" stroke="#6b6b63" stroke-width="2"/>
<use href="#module" x="420" y="154"/>

<use href="#cow" x="302" y="200"/>
<use href="#cow" x="366" y="200"/>
<use href="#cow" x="428" y="200"/>
<use href="#person" x="196" y="200"/>

<text x="128" y="112" fill="#8a7f6a" font-size="11" font-style="italic" text-anchor="middle">the parlor it offsets</text>
<text x="384" y="122" fill="#6a7a52" font-size="11" font-style="italic" text-anchor="middle">shade the herd already seeks, and the wear that follows it</text>

<!-- ================= SCALE footprint ================= -->
<line x1="572" y1="62" x2="572" y2="242" stroke="#ece7db" stroke-width="1"/>

<polygon points="690,132 708,150 690,168 672,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<polygon points="690,114 726,150 690,186 654,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<polygon points="690,96 744,150 690,204 636,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="96" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="744" y2="150" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="204" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="636" y2="150" stroke="#d8d2c4" stroke-width="1"/>

<text x="690" y="85" fill="#6f4a9c" font-size="10.5" font-weight="600" text-anchor="middle">Communities</text>
<text x="752" y="150" fill="#3f8f36" font-size="10.5" font-weight="600" text-anchor="start" dominant-baseline="middle">Agriculture</text>
<text x="690" y="218" fill="#c08a12" font-size="10.5" font-weight="600" text-anchor="middle">Energy</text>
<text x="628" y="150" fill="#2b7fb0" font-size="10.5" font-weight="600" text-anchor="end" dominant-baseline="middle">Landscapes</text>

<polygon points="690,140.5 694.8,150 690,182.1 668.1,150" fill="#3b6ea5" fill-opacity="0.18" stroke="#3b6ea5" stroke-width="1.8"/>
<circle cx="690" cy="140.5" r="2.2" fill="#2c5580"/>
<circle cx="694.8" cy="150" r="2.2" fill="#2c5580"/>
<circle cx="690" cy="182.1" r="2.2" fill="#2c5580"/>
<circle cx="668.1" cy="150" r="2.2" fill="#2c5580"/>

<text x="690" y="238" fill="#7a7973" font-size="10" font-style="italic" text-anchor="middle">regeneration at the center</text>
</svg>
