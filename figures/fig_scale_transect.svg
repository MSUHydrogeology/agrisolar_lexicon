<text class="cap" x="20" y="458">Bars show how much of a lever is left, not how well it is used. Ownership does not narrow, it moves, and the generation revenue moves with it.</text>
<text class="cap" x="20" y="474">Capacity is an indicator, not a definition. Bands are indicative for the US Midwest and need regional calibration.</text>
