<svg xmlns="http://www.w3.org/2000/svg" width="880" height="308" viewBox="0 0 880 308" role="img">
<title>The five zones of the scale transect</title>
<desc>Five zones from the farmstead to the region, each with its indicative capacity and footprint. A1 Farmstead, under 100 kW and under about an acre. A2 Field, 100 kW to 1 MW on roughly half an acre to eight acres. A3 Parcel, 1 to 5 MW on roughly six to thirty acres. A4 Landscape, 5 to 50 MW on roughly thirty to three hundred acres. A5 Regional, above 50 MW on three hundred acres and up. Building-mounted arrays are A0 and take no ground at all, so they sit at the origin of the gradient rather than on it.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.zn{font-size:14px;font-weight:600;fill:#173404}
.zc{font-size:12.5px;fill:#3b6d11}
.zf{font-size:11.5px;fill:#75736c}
.cap{font-size:11.5px;fill:#8a8880}
.eb{font-size:10.5px;font-weight:700;fill:#8a8880;letter-spacing:.06em}
</style>
<defs><marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,2 L9,5 L0,8 z" fill="#b4b2a9"/></marker></defs>
<text class="eb" x="16" y="24">A0 · BUILDING-MOUNTED — NO GROUND TAKEN, SO NOT ON THE GRADIENT</text>
<rect x="16" y="40" width="158" height="196" rx="7" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
<rect x="17" y="41" width="156" height="118" rx="6" fill="#EAF3DE"/>
<text class="zn" x="95" y="184" text-anchor="middle">A1 · Farmstead</text>
<text class="zc" x="95" y="204" text-anchor="middle">&lt;100 kW</text>
<text class="zf" x="95" y="222" text-anchor="middle">under ~1 acre</text>
<rect x="188" y="40" width="158" height="196" rx="7" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
<rect x="189" y="41" width="156" height="118" rx="6" fill="#DCEBC8"/>
<text class="zn" x="267" y="184" text-anchor="middle">A2 · Field</text>
<text class="zc" x="267" y="204" text-anchor="middle">100 kW – 1 MW</text>
<text class="zf" x="267" y="222" text-anchor="middle">~0.5–8 acres</text>
<rect x="360" y="40" width="158" height="196" rx="7" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
<rect x="361" y="41" width="156" height="118" rx="6" fill="#C0DD97"/>
<text class="zn" x="439" y="184" text-anchor="middle">A3 · Parcel</text>
<text class="zc" x="439" y="204" text-anchor="middle">1 – 5 MW</text>
<text class="zf" x="439" y="222" text-anchor="middle">~6–30 acres</text>
<rect x="532" y="40" width="158" height="196" rx="7" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
<rect x="533" y="41" width="156" height="118" rx="6" fill="#AED483"/>
<text class="zn" x="611" y="184" text-anchor="middle">A4 · Landscape</text>
<text class="zc" x="611" y="204" text-anchor="middle">5 – 50 MW</text>
<text class="zf" x="611" y="222" text-anchor="middle">~30–300 acres</text>
<rect x="704" y="40" width="158" height="196" rx="7" fill="#ffffff" stroke="#d3d1c7" stroke-width="1"/>
<rect x="705" y="41" width="156" height="118" rx="6" fill="#97C459"/>
<text class="zn" x="783" y="184" text-anchor="middle">A5 · Regional</text>
<text class="zc" x="783" y="204" text-anchor="middle">50 MW +</text>
<text class="zf" x="783" y="222" text-anchor="middle">~300–10,000+ acres</text>
<line x1="16" y1="258" x2="862" y2="258" stroke="#b4b2a9" stroke-width="1.6" marker-end="url(#gr)"/>
<text class="cap" x="16" y="280">one operator, one decision</text>
<text class="cap" x="862" y="280" text-anchor="end">a land market, a queue, and many jurisdictions</text>
<text class="cap" x="16" y="298">Capacity is an indicator, not a definition. Footprints are indicative for the US Midwest and need regional calibration.</text>
</svg>
