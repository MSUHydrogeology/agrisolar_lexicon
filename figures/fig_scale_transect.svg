<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img">
<title>The scale transect, zones A1 to A5, and what it does to each design lever</title>
<desc>Five zones from Farmstead to Regional. Interconnection runs from behind-the-meter to transmission. Below it, one row per design lever, with a bar showing how much of that lever is left at each zone. Siting is opportunistic at A1, peaks at A3, and is assembly-driven and nearly gone by A5. Structure is widest at A1, where an array is built to fit a particular yard, and narrows to commodity racking at A5. Management barely exists at A1 and carries everything at A4 and A5. Ownership does not narrow but moves, from owner-operator through landowner and developer capital to a utility, and the generation revenue moves with it. Contracts hold full strength at every zone and change only in form. The bottom row is the restoration mode that follows: structure-led at A1, siting-led at A3, management-led at A4 and A5. Contract-led is absent because it is the one mode scale does not ration.</desc>
