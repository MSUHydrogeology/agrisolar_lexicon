<svg xmlns="http://www.w3.org/2000/svg" width="880" height="446" viewBox="0 0 880 446" role="img">
<title>How the design language fits together</title>
<desc>Nine design pressures push on six design levers: scale, siting, structure, management, ownership, and contracts. Setting the levers produces three things the rest of the document is organized around: a position on the scale transect, which comes from the scale lever; a position on the sharing-sparing axis, which comes jointly from siting, structure, and management; and the restorative functions, which come from the remaining levers. A recurring set of lever settings is an archetype. Regionality changes how hard each pressure pushes, so the same levers are set differently in different places.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.eb{font-size:10.5px;font-weight:700;fill:#8a8880;letter-spacing:.06em}
.ct{font-size:15.5px;font-weight:600;fill:#2c2c2a}
.cs{font-size:11.5px;fill:#75736c}
.lv{font-size:12.5px;font-weight:600;fill:#2c2c2a}
.lvs{font-size:10.5px;fill:#75736c}
.ot{font-size:12.5px;font-weight:600;fill:#2c2c2a}
.os{font-size:10.5px;fill:#75736c}
.ft{font-size:11.5px;fill:#5f5e5a}
.card{fill:none;stroke:#d3d1c7;stroke-width:1}
.hero{fill:#f6f5f1;stroke:#b4b2a9;stroke-width:1.4}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b4b2a9"/></marker></defs>
<text class="eb" x="16" y="30">WHAT PUSHES</text>
<rect class="card" x="16" y="42" width="212" height="258" rx="6"/>
<text class="ct" x="32" y="70">Design pressures</text>
<text class="cs" x="32" y="90">nine forces, genuinely opposed</text>
<circle cx="38" cy="108" r="3" fill="#35887a"/>
<text class="lvs" x="48" y="112">restorative goals</text>
<circle cx="38" cy="123" r="3" fill="#35887a"/>
<text class="lvs" x="48" y="127">community benefit</text>
<circle cx="38" cy="138" r="3" fill="#35887a"/>
<text class="lvs" x="48" y="142">end-of-life</text>
<circle cx="38" cy="153" r="3" fill="#6f6d66"/>
<text class="lvs" x="48" y="157">farming</text>
<circle cx="38" cy="168" r="3" fill="#6f6d66"/>
<text class="lvs" x="48" y="172">grid and market</text>
<circle cx="38" cy="183" r="3" fill="#6f6d66"/>
<text class="lvs" x="48" y="187">policy</text>
<circle cx="38" cy="198" r="3" fill="#b5643a"/>
<text class="lvs" x="48" y="202">energy yield</text>
<circle cx="38" cy="213" r="3" fill="#b5643a"/>
<text class="lvs" x="48" y="217">build cost</text>
<circle cx="38" cy="228" r="3" fill="#b5643a"/>
<text class="lvs" x="48" y="232">upkeep</text>
<text class="cs" x="32" y="272">three toward, three away,</text>
<text class="cs" x="32" y="288">three either way</text>
<line x1="228" y1="147" x2="266" y2="147" stroke="#b4b2a9" stroke-width="1.6" marker-end="url(#ar)"/>
<text class="eb" x="274" y="30">WHAT YOU DECIDE</text>
<rect class="hero" x="274" y="42" width="248" height="258" rx="6"/>
<text class="ct" x="292" y="70">Design levers</text>
<text class="cs" x="292" y="90">the only things anyone can change</text>
<text class="lv" x="292" y="114">Scale</text>
<text class="lvs" x="396" y="114">how much ground</text>
<text class="lv" x="292" y="137">Siting</text>
<text class="lvs" x="396" y="137">which ground</text>
<text class="lv" x="292" y="160">Structure</text>
<text class="lvs" x="396" y="160">what gets built</text>
<text class="lv" x="292" y="183">Management</text>
<text class="lvs" x="396" y="183">what grows and how</text>
<text class="lv" x="292" y="206">Ownership</text>
<text class="lvs" x="396" y="206">who holds it</text>
<text class="lv" x="292" y="229">Contracts</text>
<text class="lvs" x="396" y="229">what was signed</text>
<text class="cs" x="292" y="280">four act on ground, two on paper</text>
<line x1="522" y1="147" x2="560" y2="147" stroke="#b4b2a9" stroke-width="1.6" marker-end="url(#ar)"/>
<text class="eb" x="568" y="30">WHAT COMES OUT</text>
<rect class="card" x="568" y="42" width="296" height="258" rx="6"/>
<text class="ot" x="586" y="76">A place on the scale transect</text>
<text class="os" x="586" y="94">read straight off the scale lever</text>
<text class="ot" x="586" y="128">A place on the sharing–sparing axis</text>
<text class="os" x="586" y="146">siting, structure, and management together</text>
<text class="ot" x="586" y="180">Restorative functions</text>
<text class="os" x="586" y="198">water, soil, ecology, microclimate,</text>
<text class="os" x="586" y="216">agriculture, community</text>
<line x1="586" y1="244" x2="846" y2="244" stroke="#e2e0d8" stroke-width="1"/>
<text class="os" x="586" y="264">a recurring set of settings is an <tspan font-weight="600" fill="#2c2c2a">archetype</tspan></text>
<line x1="16" y1="336" x2="864" y2="336" stroke="#d3d1c7" stroke-width="1"/>
<text class="eb" x="16" y="366">REGIONALITY</text>
<text class="ft" x="16" y="392">Sun, water, crop, and grid conditions change how hard each pressure pushes, so the same levers get set</text>
<text class="ft" x="16" y="410">differently in California and in Iowa. The aim is argued; the dimensions are left to the site.</text>
</svg>
