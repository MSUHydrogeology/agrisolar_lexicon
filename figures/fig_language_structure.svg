<text class="cd" x="756" y="122" text-anchor="middle">A2</text>
<rect x="778" y="106" width="32" height="24" rx="4" fill="#C0DD97" stroke="#c9c6bc" stroke-width="0.5"/>
<text class="cd" x="794" y="122" text-anchor="middle">A3</text>
<rect x="816" y="106" width="32" height="24" rx="4" fill="#AED483" stroke="#c9c6bc" stroke-width="0.5"/>
<text class="cd" x="832" y="122" text-anchor="middle">A4</text>
<rect x="854" y="106" width="32" height="24" rx="4" fill="#97C459" stroke="#c9c6bc" stroke-width="0.5"/>
<text class="cd" x="870" y="122" text-anchor="middle">A5</text>
<text class="gl" x="702" y="146">farmstead → region</text>
<text class="ot" x="702" y="186">a place on the siting axis</text>
<rect x="702" y="196" width="32" height="24" rx="4" fill="#7fb3d9" stroke="#c9c6bc" stroke-width="0.5"/>
<text class="cd" x="718" y="212" text-anchor="middle">S1</text>
<rect x="740" y="196" width="32" height="24" rx="4" fill="#bfdaec" stroke="#c9c6bc" stroke-width="0.5"/>
<text class="cd" x="756" y="212" text-anchor="middle">S2</text>
<rect x="778" y="196" width="32" height="24" rx="4" fill="#efeeea" stroke="#c9c6bc" stroke-width="0.5"/>
<text class="cd" x="794" y="212" text-anchor="middle">S3</text>
<rect x="816" y="196" width="32" height="24" rx="4" fill="#d9cbe6" stroke="#c9c6bc" stroke-width="0.5"/>
<text class="cd" x="832" y="212" text-anchor="middle">S4</text>
<rect x="854" y="196" width="32" height="24" rx="4" fill="#b69ed4" stroke="#c9c6bc" stroke-width="0.5"/>
<text class="cd" x="870" y="212" text-anchor="middle">S5</text>
<text class="gl" x="702" y="236">sharing → coexistence → sparing</text>
<text class="ot" x="702" y="276">a restoration mode</text>
<rect x="702" y="286" width="32" height="10" rx="3" fill="#639922"/>
<rect x="740" y="286" width="32" height="10" rx="3" fill="#5f7fa8"/>
<rect x="778" y="286" width="32" height="10" rx="3" fill="#b5843a"/>
<rect x="816" y="286" width="32" height="10" rx="3" fill="#8a6ba8"/>
<rect x="854" y="286" width="32" height="10" rx="3" fill="#2f7f70"/>
<text class="gl" x="702" y="308">siting · structure · management · ownership · contract</text>
<text class="gl" x="702" y="323">which lever carries the restorative work</text>
<line x1="16" y1="352" x2="984" y2="352" stroke="#e2e0d8"/>
<text class="ft" x="16" y="378">A setting that recurs on real ground is an <tspan font-weight="600" fill="#2c2c2a">archetype</tspan>. Regionality changes how hard each pressure pushes, so the same levers</text>
<text class="ft" x="16" y="396">get set differently in California and in Iowa.</text>
</svg>
