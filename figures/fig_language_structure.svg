<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="442" viewBox="0 0 1000 442" role="img">
<title>How the design language fits together</title>
<desc>Nine design pressures push in from the left on a bank of six levers drawn as sliders: scale, siting, structure, management, ownership, and contracts. Scale sets the frame, the next three act on ground, and the last two act on paper. Three things come out on the right. Scale is read off the scale transect, five zones from A1 at the farmstead to A5 at regional scale. Siting is read off the siting axis, five positions from S1, full sharing, through S3, coexistence, to S5, impaired-land retirement. And the setting commits the project to a restoration mode: siting-led, structure-led, management-led, ownership-led, or contract-led. A setting that recurs on real ground is an archetype, and regionality changes how hard each pressure pushes.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.eb{font-size:10.5px;font-weight:700;fill:#8a8880;letter-spacing:.07em}
.nm{font-size:11.5px;font-weight:600;fill:#2c2c2a}
.gl{font-size:10px;fill:#8a8880}
.ot{font-size:12.5px;font-weight:600;fill:#2c2c2a}
.cd{font-size:10.5px;font-weight:600;fill:#2c2c2a}
.ft{font-size:11px;fill:#8a8880}
</style>
<defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#c2beb4"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1.5 L9,5 L0,8.5 z" fill="#8a8880"/></marker></defs>
<text class="eb" x="16" y="86">NINE PRESSURES</text>
<line x1="16" y1="124" x2="182" y2="124" stroke="#c2beb4" stroke-width="2" marker-end="url(#p)"/>
<line x1="16" y1="156" x2="182" y2="156" stroke="#c2beb4" stroke-width="2" marker-end="url(#p)"/>
<line x1="16" y1="188" x2="182" y2="188" stroke="#c2beb4" stroke-width="2" marker-end="url(#p)"/>
<line x1="16" y1="220" x2="182" y2="220" stroke="#c2beb4" stroke-width="2" marker-end="url(#p)"/>
<line x1="16" y1="252" x2="182" y2="252" stroke="#c2beb4" stroke-width="2" marker-end="url(#p)"/>
<text class="gl" x="16" y="298">they argue over where</text>
<text class="gl" x="16" y="313">each lever gets set</text>
<rect x="200" y="72" width="476" height="228" rx="10" fill="#faf9f6" stroke="#e2e0d8"/>
<text class="eb" x="216" y="62">SIX LEVERS</text>
<rect x="233" y="104" width="10" height="168" rx="5" fill="#eceae3"/>
<rect x="233" y="141" width="10" height="131" rx="5" fill="#6f6d66" opacity="0.3"/>
<rect x="226" y="134" width="24" height="14" rx="4" fill="#6f6d66"/>
<text class="nm" x="238" y="294" text-anchor="middle">Scale</text>
<text class="gl" x="238" y="308" text-anchor="middle">how much</text>
<rect x="313" y="104" width="10" height="168" rx="5" fill="#eceae3"/>
<rect x="313" y="168" width="10" height="104" rx="5" fill="#a8894f" opacity="0.3"/>
<rect x="306" y="161" width="24" height="14" rx="4" fill="#a8894f"/>
<text class="nm" x="318" y="294" text-anchor="middle">Siting</text>
<text class="gl" x="318" y="308" text-anchor="middle">which ground</text>
<rect x="393" y="104" width="10" height="168" rx="5" fill="#eceae3"/>
