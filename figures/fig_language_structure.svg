<rect x="626" y="173" width="24" height="14" rx="4" fill="#7d6b8f"/>
<text class="nm" x="638" y="294" text-anchor="middle">Contracts</text>
<text class="gl" x="638" y="308" text-anchor="middle">what is signed</text>
<line x1="660" y1="186" x2="688" y2="186" stroke="#8a8880" stroke-width="2" marker-end="url(#o)"/>
<text class="eb" x="702" y="62">WHAT COMES OUT</text>
<text class="ot" x="702" y="96">a place on the scale transect</text>
<rect x="702" y="106" width="32" height="24" rx="4" fill="#EAF3DE" stroke="#c9c6bc" stroke-width="0.5"/>
