<text class="hd" x="293" y="28" text-anchor="middle">WHICH POSITIONS REACH IT</text>
<text class="hd" x="497" y="28" text-anchor="middle">HOW FAR THE BENEFIT GOES</text>
<text class="hd" x="676" y="28" text-anchor="middle">BY CHANNEL</text>
<text class="sub" x="408" y="50" text-anchor="middle">on-site</text>
<text class="sub" x="467" y="50" text-anchor="middle">adjacent</text>
<text class="sub" x="526" y="50" text-anchor="middle">downstream</text>
<text class="sub" x="585" y="50" text-anchor="middle">regional</text>
<line x1="16" y1="58" x2="744" y2="58" stroke="#d3d1c7" stroke-width="1"/>
<text class="nm" x="16" y="84">Water</text><text class="gl" x="16" y="99">quantity, and what the runoff carries</text>
<rect class="on" x="230" y="76" width="22" height="22" rx="3" stroke-dasharray="3 2"/><text class="pn" x="241" y="91" text-anchor="middle">S1</text>
<rect x="256" y="76" width="22" height="22" rx="3" fill="#bfdaec"/><text class="pc" x="267" y="91" text-anchor="middle">S2</text>
<rect x="282" y="76" width="22" height="22" rx="3" fill="#efeeea"/><text class="pc" x="293" y="91" text-anchor="middle">S3</text>
<rect x="308" y="76" width="22" height="22" rx="3" fill="#d9cbe6"/><text class="pc" x="319" y="91" text-anchor="middle">S4</text>
<rect x="334" y="76" width="22" height="22" rx="3" fill="#b69ed4"/><text class="pc" x="345" y="91" text-anchor="middle">S5</text>
<rect x="380" y="76" width="56" height="22" rx="3" fill="#5f5e5a"/>
<rect class="on" x="439" y="76" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect x="498" y="76" width="56" height="22" rx="3" fill="#5f5e5a"/>
<rect x="557" y="76" width="56" height="22" rx="3" fill="#5f5e5a"/>
<text class="nm" x="16" y="144">Soil and carbon</text><text class="gl" x="16" y="159">what builds back up underneath</text>
<rect class="on" x="230" y="136" width="22" height="22" rx="3" stroke-dasharray="3 2"/><text class="pn" x="241" y="151" text-anchor="middle">S1</text>
<rect x="256" y="136" width="22" height="22" rx="3" fill="#bfdaec"/><text class="pc" x="267" y="151" text-anchor="middle">S2</text>
<rect x="282" y="136" width="22" height="22" rx="3" fill="#efeeea"/><text class="pc" x="293" y="151" text-anchor="middle">S3</text>
<rect x="308" y="136" width="22" height="22" rx="3" fill="#d9cbe6"/><text class="pc" x="319" y="151" text-anchor="middle">S4</text>
<rect x="334" y="136" width="22" height="22" rx="3" fill="#b69ed4"/><text class="pc" x="345" y="151" text-anchor="middle">S5</text>
