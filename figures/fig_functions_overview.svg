<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452" role="img">
<title>The six restorative functions, which positions reach each one, and how far its benefit travels</title>
<desc>A row for each of the six restorative functions. Water, soil and carbon, habitat, and agriculture need a designed ground layer, so they are reachable at S2 through S5 rather than at S1; microclimate and the community function are reachable at every position. The right columns show how far each benefit travels, in four bands from on-site to regional, plus a channel column for benefits that move along tenure, contract, and jurisdiction instead of across ground. Water reaches on-site, downstream, and regional. Soil and carbon reaches on-site and, through carbon, regional. Habitat reaches on-site, adjacent, and regional. Microclimate reaches on-site only. Agriculture reaches on-site and adjacent, and also by channel through the lease. Community and economy reaches adjacent through local hiring and construction spend, and otherwise by channel.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.nm{font-size:13px;font-weight:600;fill:#3d3d3a}
.gl{font-size:11.5px;fill:#7a7973}
.hd{font-size:10px;font-weight:700;letter-spacing:.06em;fill:#8a8880}
.sub{font-size:9px;fill:#8a8880}
.pc{font-size:10.5px;font-weight:600;fill:#2c2c2a}
.pn{font-size:10.5px;font-weight:600;fill:#c4c1b8}
.fn{font-size:11px;fill:#7a7973}
.on{stroke:#cfccc3;stroke-width:1;fill:#ffffff}
</style>
<defs><marker id="ch" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0.5 L7,4 L0,7.5 z" fill="#6f6d66"/></marker></defs>
