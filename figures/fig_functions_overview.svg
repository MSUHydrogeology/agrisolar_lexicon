<svg xmlns="http://www.w3.org/2000/svg" width="910" height="452" viewBox="0 0 910 452" role="img">
<title>The six restorative functions, how the restorative work is done, which positions reach each one, and how far its benefit travels</title>
<desc>A row for each of the six restorative functions. The first column after each name gives the restoration mode, meaning how the work is actually done: water is siting-led at small and mid scale and management-led at utility scale; soil and carbon and habitat are management-led; microclimate is structure-led, carried by array geometry; agriculture is both siting-led and management-led; and the community and economic function is contract-led, carried by lease, tax, and subscription rather than by anything on the ground. The next columns show which sharing-sparing positions reach each function. Water, soil and carbon, habitat, and agriculture need a designed ground layer, so they are reachable at S2 through S5 rather than at S1; microclimate and the community function are reachable at every position. The right columns show how far each benefit travels, in four bands from on-site to regional, plus a channel column for benefits that move along tenure, contract, and jurisdiction instead of across ground. Water reaches on-site, downstream, and regional. Soil and carbon reaches on-site and, through carbon, regional. Habitat reaches on-site, adjacent, and regional. Microclimate reaches on-site only. Agriculture reaches on-site and adjacent, and also by channel through the lease. Community and economy reaches adjacent through local hiring and construction spend, and otherwise by channel.</desc>
