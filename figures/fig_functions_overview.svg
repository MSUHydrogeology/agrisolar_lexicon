<svg xmlns="http://www.w3.org/2000/svg" width="760" height="452" viewBox="0 0 760 452" role="img">
<title>The six restorative functions, how the restorative work is done in each, and how far the benefit travels</title>
<desc>A row for each of the six restorative functions. The middle column gives the restoration mode, meaning how the work is actually done: water is siting-led where a designer can choose the ground and management-led at utility scale; soil and carbon and habitat are management-led; microclimate is structure-led, carried by the array geometry; agriculture is both siting-led and management-led; and the community and economic function is contract-led, carried by lease, tax, and subscription rather than by anything on the ground. The right columns show how far each benefit travels, in four bands from on-site to regional, plus a channel column for benefits that move along tenure, contract, and jurisdiction instead of across ground. Water reaches on-site, downstream, and regional. Soil and carbon reaches on-site and, through carbon, regional. Habitat reaches on-site, adjacent, and regional. Microclimate reaches on-site only. Agriculture reaches on-site and adjacent, and also by channel through the lease. Community and economy reaches adjacent through local hiring and construction spend, and otherwise by channel.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.nm{font-size:14px;font-weight:600;fill:#3d3d3a}
.gl{font-size:12.5px;fill:#7a7973}
.hd{font-size:10.5px;font-weight:700;letter-spacing:.06em;fill:#8a8880}
.sub{font-size:10px;fill:#8a8880}
.fn{font-size:11.5px;fill:#7a7973}
.md{font-size:11px;fill:#5f5e5a}
.on{stroke:#cfccc3;stroke-width:1;fill:#ffffff}
</style>
<defs><marker id="ch" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0.5 L7,4 L0,7.5 z" fill="#6f6d66"/></marker></defs>
