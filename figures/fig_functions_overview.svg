<svg xmlns="http://www.w3.org/2000/svg" width="760" height="406" viewBox="0 0 760 406" role="img">
<title>The five restorative functions, which positions reach each one, and how far its benefit travels</title>
<desc>A row for each of the five restorative functions. The middle columns show which sharing-sparing positions can deliver it: water, soil and carbon, and habitat are reachable at S2 through S5 but not at S1, while microclimate and community and economy are reachable at every position. The right columns show how far the benefit travels, in four bands from on-site to regional. Water reaches the most bands: on-site, downstream, and regional. Soil and carbon reaches on-site and, through carbon, regional. Habitat reaches on-site, adjacent, and regional. Microclimate reaches on-site and nowhere else. Community and economy reaches none of the four bands, because it travels by channel instead, along tenure, contract, and jurisdiction.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.nm{font-size:13px;font-weight:600;fill:#3d3d3a}
.gl{font-size:11.5px;fill:#7a7973}
.hd{font-size:10px;font-weight:700;letter-spacing:.06em;fill:#8a8880}
.sub{font-size:9px;fill:#8a8880}
.pc{font-size:10.5px;font-weight:600;fill:#2c2c2a}
.pn{font-size:10.5px;font-weight:600;fill:#c4c1b8}
.fn{font-size:11px;fill:#7a7973}
.on{stroke:#cfccc3;stroke-width:1;fill:#ffffff}
</style>
<defs>
<marker id="ch" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0.5 L7,4 L0,7.5 z" fill="#6f6d66"/></marker>
</defs>

<text class="hd" x="16" y="28">FUNCTION</text>
<text class="hd" x="293" y="28" text-anchor="middle">WHICH POSITIONS REACH IT</text>
<text class="hd" x="497" y="28" text-anchor="middle">HOW FAR THE BENEFIT GOES</text>
<text class="hd" x="676" y="28" text-anchor="middle">BY CHANNEL</text>
<text class="sub" x="408" y="50" text-anchor="middle">on-site</text>
<text class="sub" x="467" y="50" text-anchor="middle">adjacent</text>
<text class="sub" x="526" y="50" text-anchor="middle">downstream</text>
<text class="sub" x="585" y="50" text-anchor="middle">regional</text>
<line x1="16" y1="58" x2="744" y2="58" stroke="#d3d1c7" stroke-width="1"/>

<!-- Water : S2-S5 · on-site, downstream, regional -->
<text class="nm" x="16" y="88">Water</text><text class="gl" x="16" y="103">what soaks in and what runs off</text>
<rect class="on" x="230" y="80" width="22" height="22" rx="3" stroke-dasharray="3 2"/><text class="pn" x="241" y="95" text-anchor="middle">S1</text>
<rect x="256" y="80" width="22" height="22" rx="3" fill="#bfdaec"/><text class="pc" x="267" y="95" text-anchor="middle">S2</text>
<rect x="282" y="80" width="22" height="22" rx="3" fill="#efeeea"/><text class="pc" x="293" y="95" text-anchor="middle">S3</text>
<rect x="308" y="80" width="22" height="22" rx="3" fill="#d9cbe6"/><text class="pc" x="319" y="95" text-anchor="middle">S4</text>
<rect x="334" y="80" width="22" height="22" rx="3" fill="#b69ed4"/><text class="pc" x="345" y="95" text-anchor="middle">S5</text>
<rect x="380" y="80" width="56" height="22" rx="3" fill="#5f5e5a"/>
<rect class="on" x="439" y="80" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect x="498" y="80" width="56" height="22" rx="3" fill="#5f5e5a"/>
<rect x="557" y="80" width="56" height="22" rx="3" fill="#5f5e5a"/>

<!-- Soil and carbon : S2-S5 · on-site, regional (carbon) -->
<text class="nm" x="16" y="146">Soil and carbon</text><text class="gl" x="16" y="161">what builds back up underneath</text>
<rect class="on" x="230" y="138" width="22" height="22" rx="3" stroke-dasharray="3 2"/><text class="pn" x="241" y="153" text-anchor="middle">S1</text>
<rect x="256" y="138" width="22" height="22" rx="3" fill="#bfdaec"/><text class="pc" x="267" y="153" text-anchor="middle">S2</text>
<rect x="282" y="138" width="22" height="22" rx="3" fill="#efeeea"/><text class="pc" x="293" y="153" text-anchor="middle">S3</text>
<rect x="308" y="138" width="22" height="22" rx="3" fill="#d9cbe6"/><text class="pc" x="319" y="153" text-anchor="middle">S4</text>
<rect x="334" y="138" width="22" height="22" rx="3" fill="#b69ed4"/><text class="pc" x="345" y="153" text-anchor="middle">S5</text>
<rect x="380" y="138" width="56" height="22" rx="3" fill="#5f5e5a"/>
<rect class="on" x="439" y="138" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect class="on" x="498" y="138" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect x="557" y="138" width="56" height="22" rx="3" fill="#5f5e5a"/>
<text class="sub" x="585" y="174" text-anchor="middle" fill="#7a7973">carbon only</text>

<!-- Habitat : S2-S5 · on-site, adjacent, regional -->
<text class="nm" x="16" y="204">Habitat</text><text class="gl" x="16" y="219">what can live there</text>
<rect class="on" x="230" y="196" width="22" height="22" rx="3" stroke-dasharray="3 2"/><text class="pn" x="241" y="211" text-anchor="middle">S1</text>
<rect x="256" y="196" width="22" height="22" rx="3" fill="#bfdaec"/><text class="pc" x="267" y="211" text-anchor="middle">S2</text>
<rect x="282" y="196" width="22" height="22" rx="3" fill="#efeeea"/><text class="pc" x="293" y="211" text-anchor="middle">S3</text>
<rect x="308" y="196" width="22" height="22" rx="3" fill="#d9cbe6"/><text class="pc" x="319" y="211" text-anchor="middle">S4</text>
<rect x="334" y="196" width="22" height="22" rx="3" fill="#b69ed4"/><text class="pc" x="345" y="211" text-anchor="middle">S5</text>
<rect x="380" y="196" width="56" height="22" rx="3" fill="#5f5e5a"/>
<rect x="439" y="196" width="56" height="22" rx="3" fill="#5f5e5a"/>
<rect class="on" x="498" y="196" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect x="557" y="196" width="56" height="22" rx="3" fill="#5f5e5a"/>

<!-- Microclimate : all positions, climate-conditional · on-site only -->
<text class="nm" x="16" y="262">Microclimate</text><text class="gl" x="16" y="277">shade and moisture at the ground</text>
<rect x="230" y="254" width="22" height="22" rx="3" fill="#7fb3d9"/><text class="pc" x="241" y="269" text-anchor="middle">S1</text>
<rect x="256" y="254" width="22" height="22" rx="3" fill="#bfdaec"/><text class="pc" x="267" y="269" text-anchor="middle">S2</text>
<rect x="282" y="254" width="22" height="22" rx="3" fill="#efeeea"/><text class="pc" x="293" y="269" text-anchor="middle">S3</text>
<rect x="308" y="254" width="22" height="22" rx="3" fill="#d9cbe6"/><text class="pc" x="319" y="269" text-anchor="middle">S4</text>
<rect x="334" y="254" width="22" height="22" rx="3" fill="#b69ed4"/><text class="pc" x="345" y="269" text-anchor="middle">S5</text>
<text class="sub" x="293" y="290" text-anchor="middle" fill="#7a7973">set by climate and crop, not by position</text>
<rect x="380" y="254" width="56" height="22" rx="3" fill="#5f5e5a"/>
<rect class="on" x="439" y="254" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect class="on" x="498" y="254" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect class="on" x="557" y="254" width="56" height="22" rx="3" stroke-dasharray="3 2"/>

<!-- Community and economy : all positions · no band, travels by channel -->
<text class="nm" x="16" y="326">Community and economy</text><text class="gl" x="16" y="341">what the hosts actually get</text>
<rect x="230" y="318" width="22" height="22" rx="3" fill="#7fb3d9"/><text class="pc" x="241" y="333" text-anchor="middle">S1</text>
<rect x="256" y="318" width="22" height="22" rx="3" fill="#bfdaec"/><text class="pc" x="267" y="333" text-anchor="middle">S2</text>
<rect x="282" y="318" width="22" height="22" rx="3" fill="#efeeea"/><text class="pc" x="293" y="333" text-anchor="middle">S3</text>
<rect x="308" y="318" width="22" height="22" rx="3" fill="#d9cbe6"/><text class="pc" x="319" y="333" text-anchor="middle">S4</text>
<rect x="334" y="318" width="22" height="22" rx="3" fill="#b69ed4"/><text class="pc" x="345" y="333" text-anchor="middle">S5</text>
<rect class="on" x="380" y="318" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect class="on" x="439" y="318" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect class="on" x="498" y="318" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect class="on" x="557" y="318" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<line x1="628" y1="329" x2="716" y2="329" stroke="#6f6d66" stroke-width="2.4" marker-end="url(#ch)"/>
<text class="sub" x="672" y="345" text-anchor="middle" fill="#7a7973">tenure · contract · jurisdiction</text>

<line x1="16" y1="368" x2="744" y2="368" stroke="#d3d1c7" stroke-width="1"/>
<rect x="16" y="382" width="18" height="12" rx="2" fill="#5f5e5a"/>
<text class="fn" x="40" y="392">reaches this band</text>
<rect class="on" x="164" y="382" width="18" height="12" rx="2" stroke-dasharray="3 2"/>
<text class="fn" x="188" y="392">does not</text>
</svg>
