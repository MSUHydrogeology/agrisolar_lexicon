<rect x="334" y="196" width="22" height="22" rx="3" fill="#b69ed4"/><text class="pc" x="345" y="211" text-anchor="middle">S5</text>
<rect x="380" y="196" width="56" height="22" rx="3" fill="#5f5e5a"/>
<rect x="439" y="196" width="56" height="22" rx="3" fill="#5f5e5a"/>
<rect class="on" x="498" y="196" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect x="557" y="196" width="56" height="22" rx="3" fill="#5f5e5a"/>
<text class="nm" x="16" y="264">Microclimate</text><text class="gl" x="16" y="279">shade and moisture at the ground</text>
<rect x="230" y="256" width="22" height="22" rx="3" fill="#7fb3d9"/><text class="pc" x="241" y="271" text-anchor="middle">S1</text>
<rect x="256" y="256" width="22" height="22" rx="3" fill="#bfdaec"/><text class="pc" x="267" y="271" text-anchor="middle">S2</text>
<rect x="282" y="256" width="22" height="22" rx="3" fill="#efeeea"/><text class="pc" x="293" y="271" text-anchor="middle">S3</text>
<rect x="308" y="256" width="22" height="22" rx="3" fill="#d9cbe6"/><text class="pc" x="319" y="271" text-anchor="middle">S4</text>
<rect x="334" y="256" width="22" height="22" rx="3" fill="#b69ed4"/><text class="pc" x="345" y="271" text-anchor="middle">S5</text>
<rect x="380" y="256" width="56" height="22" rx="3" fill="#5f5e5a"/>
<rect class="on" x="439" y="256" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect class="on" x="498" y="256" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<rect class="on" x="557" y="256" width="56" height="22" rx="3" stroke-dasharray="3 2"/>
<text class="sub" x="293" y="290" text-anchor="middle" fill="#7a7973">set by climate and crop, not by position</text>
<text class="nm" x="16" y="324">Agriculture</text><text class="gl" x="16" y="339">what farming gets from it</text>
<rect class="on" x="230" y="316" width="22" height="22" rx="3" stroke-dasharray="3 2"/><text class="pn" x="241" y="331" text-anchor="middle">S1</text>
