<rect class="on" x="230" y="196" width="22" height="22" rx="3" stroke-dasharray="3 2"/><text class="pn" x="241" y="211" text-anchor="middle">S1</text>
<rect x="256" y="196" width="22" height="22" rx="3" fill="#bfdaec"/><text class="pc" x="267" y="211" text-anchor="middle">S2</text>
