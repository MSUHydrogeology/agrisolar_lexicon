<line x1="640" y1="327" x2="712" y2="327" stroke="#6f6d66" stroke-width="2.4" marker-end="url(#ch)"/>
<text class="sub" x="293" y="350" text-anchor="middle" fill="#7a7973">lease revenue reaches S1 too</text>
