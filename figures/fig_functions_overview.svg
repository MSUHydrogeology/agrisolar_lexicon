<text class="sub" x="467" y="410" text-anchor="middle" fill="#7a7973">local hiring and spend</text>
<line x1="16" y1="428" x2="744" y2="428" stroke="#d3d1c7" stroke-width="1"/>
<rect x="16" y="440" width="18" height="12" rx="2" fill="#5f5e5a"/><text class="fn" x="40" y="450">reaches this band</text>
