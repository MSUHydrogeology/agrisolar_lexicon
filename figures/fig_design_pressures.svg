<svg xmlns="http://www.w3.org/2000/svg" width="760" height="622" viewBox="0 0 760 622" role="img">
<title>Eight design pressures converging on one site, arranged by which way they push on restoration</title>
<desc>Eight design pressures drawn as arrows converging on a central disc labelled one site's resolution. The field is split down the middle: the right half is tinted for pressures that push toward restoration and holds restorative ambition, social license, and decommissioning and reversibility; the left half is tinted for pressures that push away and holds generation yield, capital discipline, and operational simplicity. Agricultural continuity and offtake conformity sit exactly on the dividing line, at top and bottom, because their direction is conditional rather than fixed: agricultural continuity carries sharing while foreclosing ecological ground layers, and offtake conformity spreads good practice or locks in a bad fit depending on what the buyer scores. Operational simplicity is annotated as flipping toward after establishment. All arrows are the same length; the figure claims a direction, not a magnitude.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.nm{font-size:13.5px;font-weight:600;fill:#3d3d3a}
.ax{font-size:12.5px;font-weight:700;letter-spacing:.03em}
.fn{font-size:12px;fill:#7a7973}
.ct{font-size:12.5px;font-style:italic;fill:#5f5e5a}
.tw{stroke:#35887a;stroke-width:2.6}
.aw{stroke:#b5643a;stroke-width:2.6}
.bo{stroke:#6f6d66;stroke-width:2.6}
.dv{stroke:#9c9a92;stroke-width:1.2;stroke-dasharray:5 5}
</style>
<defs>
<marker id="mtw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#35887a"/></marker>
<marker id="maw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b5643a"/></marker>
<marker id="mbo" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6f6d66"/></marker>
</defs>

<!-- the field, split by which way a pressure pushes; tints match the §3.1 table -->
<path d="M380,85 A215,215 0 0 1 380,515 Z" fill="#d9e9e4"/>
<path d="M380,85 A215,215 0 0 0 380,515 Z" fill="#f6e2d7"/>
<line class="dv" x1="380" y1="85" x2="380" y2="515"/>

<text class="ax" x="368" y="32" text-anchor="end" fill="#b5643a">&#8592; PUSHES AWAY FROM RESTORATION</text>
<text class="ax" x="392" y="32" text-anchor="start" fill="#35887a">PUSHES TOWARD &#8594;</text>

<!-- toward: the restorative half -->
<line class="tw" x1="572" y1="300" x2="438" y2="300" marker-end="url(#mtw)"/>
<text class="nm" x="602" y="294" text-anchor="start">Restorative</text><text class="nm" x="602" y="310" text-anchor="start">ambition</text>
<line class="tw" x1="516" y1="164" x2="421" y2="259" marker-end="url(#mtw)"/>
<text class="nm" x="541" y="143" text-anchor="start">Social license</text>
<line class="tw" x1="516" y1="436" x2="421" y2="341" marker-end="url(#mtw)"/>
<text class="nm" x="541" y="455" text-anchor="start">Decommissioning &amp;</text><text class="nm" x="541" y="471" text-anchor="start">reversibility</text>

<!-- conditional: drawn on the dividing line itself -->
<line class="bo" x1="380" y1="108" x2="380" y2="242" marker-end="url(#mbo)"/>
<text class="nm" x="380" y="72" text-anchor="middle">Agricultural continuity</text>
<line class="bo" x1="380" y1="492" x2="380" y2="358" marker-end="url(#mbo)"/>
<text class="nm" x="380" y="542" text-anchor="middle">Offtake conformity</text>

<!-- away -->
<line class="aw" x1="244" y1="164" x2="339" y2="259" marker-end="url(#maw)"/>
<text class="nm" x="219" y="143" text-anchor="end">Generation yield</text>
<line class="aw" x1="188" y1="300" x2="322" y2="300" marker-end="url(#maw)"/>
<text class="nm" x="148" y="304" text-anchor="end">Capital discipline</text>
<line class="aw" x1="244" y1="436" x2="339" y2="341" marker-end="url(#maw)"/>
<text class="nm" x="219" y="455" text-anchor="end">Operational simplicity</text>
<text class="fn" x="219" y="471" text-anchor="end" fill="#35887a">flips toward after establishment</text>

<!-- the site -->
<circle cx="380" cy="300" r="58" fill="#ffffff" stroke="#cfc8b8" stroke-width="1.2"/>
<text class="ct" x="380" y="295" text-anchor="middle">one site&#8217;s</text>
<text class="ct" x="380" y="312" text-anchor="middle">resolution</text>

<text class="fn" x="380" y="574" text-anchor="middle">Every pressure bears on the site at once, and position says which way it pushes.</text>
<text class="fn" x="380" y="590" text-anchor="middle">The two on the dividing line are the ones whose direction the site or the buyer decides.</text>
<text class="fn" x="380" y="606" text-anchor="middle">All arrows are the same length: the figure claims a direction, not a magnitude.</text>
</svg>
