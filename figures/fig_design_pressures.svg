<svg xmlns="http://www.w3.org/2000/svg" width="760" height="618" viewBox="0 0 760 618" role="img">
<title>Nine design pressures converging on one site, grouped by which way they push on restoration</title>
<desc>Nine design pressures drawn as arrows converging on a central disc labelled one site's resolution. The disc is divided into four wedges. A teal wedge on the right holds the three pressures that push toward restoration: community acceptance and benefit, restorative goals, and end-of-life responsibility. A terracotta wedge on the left holds the three that push away: energy yield, build cost and operations and maintenance. Two grey wedges hold the three whose direction is conditional: agricultural production and grid and market demands at the top, and policy and permission alone at the bottom. Because grey sits at both boundaries between the coloured wedges, the toward and away groups never touch. Arrows are evenly spaced forty degrees apart and all the same length; the figure claims a direction, not a magnitude.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.nm{font-size:13px;font-weight:600;fill:#3d3d3a}
.fn{font-size:11.5px;fill:#7a7973}
.ct{font-size:12.5px;font-style:italic;fill:#5f5e5a}
.lg{font-size:12px;font-weight:600}
</style>
<defs>
<marker id="Wt" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#35887a"/></marker>
<marker id="Wa" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b5643a"/></marker>
<marker id="Wb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6f6d66"/></marker>
</defs>

<!-- four wedges sized to their contents: 80 grey / 120 teal / 40 grey / 120 terracotta.
     grey sits at BOTH boundaries, so toward and away never meet. mirror-symmetric about vertical. -->
<path d="M380,300 L241.8,135.3 A215,215 0 0 1 518.2,135.3 Z" fill="#eae8e3"/>
<path d="M380,300 L518.2,135.3 A215,215 0 0 1 453.5,502 Z" fill="#d9e9e4"/>
<path d="M380,300 L453.5,502 A215,215 0 0 1 306.5,502 Z" fill="#eae8e3"/>
<path d="M380,300 L306.5,502 A215,215 0 0 1 241.8,135.3 Z" fill="#f6e2d7"/>
<line x1="380" y1="300" x2="241.8" y2="135.3" stroke="#ffffff" stroke-width="2"/>
<line x1="380" y1="300" x2="518.2" y2="135.3" stroke="#ffffff" stroke-width="2"/>
<line x1="380" y1="300" x2="453.5" y2="502" stroke="#ffffff" stroke-width="2"/>
<line x1="380" y1="300" x2="306.5" y2="502" stroke="#ffffff" stroke-width="2"/>

<!-- either way: top -->
<line x1="314.3" y1="119.6" x2="359.5" y2="243.6" stroke="#6f6d66" stroke-width="2.6" marker-end="url(#Wb)"/>
<text class="nm" x="301" y="66" text-anchor="middle">Agricultural</text><text class="nm" x="301" y="81" text-anchor="middle">production</text>
<line x1="445.7" y1="119.6" x2="400.5" y2="243.6" stroke="#6f6d66" stroke-width="2.6" marker-end="url(#Wb)"/>
<text class="nm" x="459" y="66" text-anchor="middle">Grid and market</text><text class="nm" x="459" y="81" text-anchor="middle">demands</text>

<!-- toward: right -->
<line x1="546.3" y1="204" x2="432" y2="270" stroke="#35887a" stroke-width="2.6" marker-end="url(#Wt)"/>
<text class="nm" x="575" y="178" text-anchor="start">Community acceptance</text><text class="nm" x="575" y="193" text-anchor="start">and benefit</text>
<line x1="569.1" y1="333.3" x2="439.1" y2="310.4" stroke="#35887a" stroke-width="2.6" marker-end="url(#Wt)"/>
<text class="nm" x="605" y="344" text-anchor="start">Restorative goals</text>
<line x1="503.4" y1="447.1" x2="418.6" y2="346" stroke="#35887a" stroke-width="2.6" marker-end="url(#Wt)"/>
<text class="nm" x="529" y="472" text-anchor="start">End-of-life</text><text class="nm" x="529" y="487" text-anchor="start">responsibility</text>

<!-- either way: bottom -->
<line x1="380" y1="492" x2="380" y2="360" stroke="#6f6d66" stroke-width="2.6" marker-end="url(#Wb)"/>
<text class="nm" x="380" y="534" text-anchor="middle">Policy and permission</text>

<!-- away: left -->
<line x1="256.6" y1="447.1" x2="341.4" y2="346" stroke="#b5643a" stroke-width="2.6" marker-end="url(#Wa)"/>
<text class="nm" x="231" y="472" text-anchor="end">Operations and</text><text class="nm" x="231" y="487" text-anchor="end">maintenance</text>
<line x1="190.9" y1="333.3" x2="320.9" y2="310.4" stroke="#b5643a" stroke-width="2.6" marker-end="url(#Wa)"/>
<text class="nm" x="155" y="344" text-anchor="end">Build cost</text>
<line x1="213.7" y1="204" x2="328" y2="270" stroke="#b5643a" stroke-width="2.6" marker-end="url(#Wa)"/>
<text class="nm" x="185" y="184" text-anchor="end">Energy yield</text>

<!-- the site -->
<circle cx="380" cy="300" r="60" fill="#ffffff" stroke="#cfc8b8" stroke-width="1.2"/>
<text class="ct" x="380" y="295" text-anchor="middle">one site&#8217;s</text>
<text class="ct" x="380" y="312" text-anchor="middle">resolution</text>

<!-- the tension, restated as an axis -->
<text class="lg" x="312" y="562" text-anchor="middle" fill="#b5643a">pushes away</text>
<text class="lg" x="448" y="562" text-anchor="middle" fill="#35887a">pushes toward</text>
<line x1="380" y1="574" x2="248" y2="574" stroke="#b5643a" stroke-width="2.2" marker-end="url(#Wa)"/>
<line x1="380" y1="574" x2="512" y2="574" stroke="#35887a" stroke-width="2.2" marker-end="url(#Wt)"/>
<rect x="340" y="590" width="13" height="13" rx="2" fill="#eae8e3" stroke="#6f6d66" stroke-width="0.8"/>
<text class="lg" x="359" y="601" fill="#6f6d66">either way</text>
</svg>
