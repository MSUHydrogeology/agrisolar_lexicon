<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 820 254" width="820" height="254" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Regenerative Solar Grazing</title>
<desc>Section through a utility-scale array running past both edges of the frame. The panels sit low, which is what limits the stock to sheep, and a contracted flock grazes the forage beneath under a planned rotation set by fences and water points. Held cover builds root mass and organic matter in the topsoil. Its SCALE footprint sits at the right: Energy nearest the center, Communities out toward the rim.</desc>

<defs>
  <!-- shared glyphs: the module and person are identical in every archetype card.
       Post height is drawn per instance, because clearance is a real design variable. -->
  <g id="module">
    <line x1="-9" y1="16" x2="9" y2="8" stroke="#6b6b63" stroke-width="1.4"/>
    <polygon points="-22,9 22,-9 22,-5 -22,13" fill="#5b6b7a" stroke="#3d4a55" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <g id="person">
    <circle cx="0" cy="-22.5" r="3.6" fill="none" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="0" y1="-19" x2="0" y2="-9" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="-4.5" y1="-15" x2="4.5" y2="-15" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="0" y1="-9" x2="-4" y2="0" stroke="#3d3a34" stroke-width="1.6"/>
    <line x1="0" y1="-9" x2="4" y2="0" stroke="#3d3a34" stroke-width="1.6"/>
  </g>
  <g id="sheep">
    <ellipse cx="0" cy="-9" rx="10" ry="5" fill="#ffffff" stroke="#3d3a34" stroke-width="1.4"/>
    <circle cx="9" cy="-12" r="3.4" fill="#ffffff" stroke="#3d3a34" stroke-width="1.3"/>
    <line x1="-5" y1="-4" x2="-5" y2="0" stroke="#3d3a34" stroke-width="1.3"/>
    <line x1="0" y1="-4" x2="0" y2="0" stroke="#3d3a34" stroke-width="1.3"/>
    <line x1="5" y1="-4" x2="5" y2="0" stroke="#3d3a34" stroke-width="1.3"/>
  </g>
  <g id="tuft">
    <line x1="0" y1="0" x2="-3" y2="-7" stroke="#8a9464" stroke-width="1.3"/>
    <line x1="0" y1="0" x2="0" y2="-8" stroke="#8a9464" stroke-width="1.3"/>
    <line x1="0" y1="0" x2="3" y2="-7" stroke="#8a9464" stroke-width="1.3"/>
  </g>
  <clipPath id="soilclipG">
    <path d="M26,205 L545,205 L545,252 L26,252 Z"/>
  </clipPath>
</defs>

<rect y="14" width="820" height="254" rx="10" fill="#ffffff" stroke="#e6e1d6"/>

<text x="26" y="32" fill="#777" font-size="11">A4–A5 · S2 · management-led</text>

<!-- ================= soil ================= -->
<path d="M26,205 L545,205 L545,252 L26,252 Z" fill="#f2ece0"/>
<g clip-path="url(#soilclipG)">
  <!-- a thicker, darker topsoil: what held cover builds -->
  <path d="M26,205 L545,205 L545,227 L26,227 Z" fill="#d9cbac"/>
  <g fill="#8a6f43" opacity="0.5">
    <circle cx="70" cy="214" r="1.2"/><circle cx="118" cy="220" r="1.2"/><circle cx="166" cy="212" r="1.2"/>
    <circle cx="214" cy="221" r="1.2"/><circle cx="262" cy="214" r="1.2"/><circle cx="310" cy="220" r="1.2"/>
    <circle cx="358" cy="213" r="1.2"/><circle cx="406" cy="221" r="1.2"/><circle cx="454" cy="214" r="1.2"/>
    <circle cx="502" cy="219" r="1.2"/>
  </g>
  <!-- pasture roots: deeper than a row crop, nothing like prairie -->
  <g fill="none" stroke="#8a6f43" stroke-width="1.1" opacity="0.85">
    <path d="M62,205 C60,214 64,220 61,230"/>
    <path d="M124,205 C127,214 122,221 126,231"/>
    <path d="M186,205 C183,214 188,220 184,229"/>
    <path d="M248,205 C251,214 246,221 250,230"/>
    <path d="M310,205 C307,214 312,220 308,231"/>
    <path d="M372,205 C375,214 370,221 374,229"/>
    <path d="M434,205 C431,214 436,220 432,230"/>
    <path d="M496,205 C499,214 494,221 498,230"/>
  </g>
</g>
<path d="M26,205 L545,205" fill="none" stroke="#8a7f6a" stroke-width="1.8"/>

<!-- ================= forage held under rotation ================= -->
<g>
  <use href="#tuft" x="46" y="205"/><use href="#tuft" x="70" y="205"/><use href="#tuft" x="94" y="205"/>
  <use href="#tuft" x="118" y="205"/><use href="#tuft" x="142" y="205"/><use href="#tuft" x="166" y="205"/>
  <use href="#tuft" x="190" y="205"/><use href="#tuft" x="214" y="205"/><use href="#tuft" x="238" y="205"/>
  <use href="#tuft" x="262" y="205"/><use href="#tuft" x="286" y="205"/><use href="#tuft" x="310" y="205"/>
  <use href="#tuft" x="334" y="205"/><use href="#tuft" x="358" y="205"/><use href="#tuft" x="382" y="205"/>
  <use href="#tuft" x="406" y="205"/><use href="#tuft" x="430" y="205"/><use href="#tuft" x="454" y="205"/>
  <use href="#tuft" x="478" y="205"/><use href="#tuft" x="502" y="205"/><use href="#tuft" x="526" y="205"/>
</g>

<!-- ================= the array, running past both edges ================= -->
<g>
  <line x1="56" y1="205" x2="56" y2="173" stroke="#6b6b63" stroke-width="2"/>
  <line x1="118" y1="205" x2="118" y2="173" stroke="#6b6b63" stroke-width="2"/>
  <line x1="180" y1="205" x2="180" y2="173" stroke="#6b6b63" stroke-width="2"/>
  <line x1="242" y1="205" x2="242" y2="173" stroke="#6b6b63" stroke-width="2"/>
  <line x1="304" y1="205" x2="304" y2="173" stroke="#6b6b63" stroke-width="2"/>
  <line x1="366" y1="205" x2="366" y2="173" stroke="#6b6b63" stroke-width="2"/>
  <line x1="428" y1="205" x2="428" y2="173" stroke="#6b6b63" stroke-width="2"/>
  <line x1="490" y1="205" x2="490" y2="173" stroke="#6b6b63" stroke-width="2"/>
</g>
<use href="#module" x="56" y="173"/>
<use href="#module" x="118" y="173"/>
<use href="#module" x="180" y="173"/>
<use href="#module" x="242" y="173"/>
<use href="#module" x="304" y="173"/>
<use href="#module" x="366" y="173"/>
<use href="#module" x="428" y="173"/>
<use href="#module" x="490" y="173"/>

<use href="#sheep" x="87" y="205"/>
<use href="#sheep" x="211" y="205"/>
<use href="#sheep" x="335" y="205"/>
<use href="#sheep" x="459" y="205"/>

<!-- rotation infrastructure: the fence line and the water point -->
<g stroke="#a89c80" stroke-width="1.3" fill="none">
  <path d="M273,205 v-26"/>
  <path d="M265,186 h16"/><path d="M265,194 h16"/><path d="M265,202 h16"/>
</g>
<rect x="390" y="196" width="26" height="9" rx="2" fill="#2b7fb0" fill-opacity="0.3" stroke="#6b6b63" stroke-width="1.2"/>

<use href="#person" x="530" y="205"/>

<text x="150" y="130" fill="#8a7f6a" font-size="11" font-style="italic" text-anchor="middle">clearance this low sets the stock: sheep, not cattle</text>
<text x="420" y="130" fill="#6a7a52" font-size="11" font-style="italic" text-anchor="middle">carbon builds under held cover</text>

<!-- ================= SCALE footprint ================= -->
<line x1="572" y1="62" x2="572" y2="242" stroke="#ece7db" stroke-width="1"/>

<polygon points="690,132 708,150 690,168 672,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<polygon points="690,114 726,150 690,186 654,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<polygon points="690,96 744,150 690,204 636,150" fill="none" stroke="#e6e1d6" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="96" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="744" y2="150" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="690" y2="204" stroke="#d8d2c4" stroke-width="1"/>
<line x1="690" y1="150" x2="636" y2="150" stroke="#d8d2c4" stroke-width="1"/>

<text x="690" y="85" fill="#6f4a9c" font-size="10.5" font-weight="600" text-anchor="middle">Communities</text>
<text x="752" y="150" fill="#3f8f36" font-size="10.5" font-weight="600" text-anchor="start" dominant-baseline="middle">Agriculture</text>
<text x="690" y="218" fill="#c08a12" font-size="10.5" font-weight="600" text-anchor="middle">Energy</text>
<text x="628" y="150" fill="#2b7fb0" font-size="10.5" font-weight="600" text-anchor="end" dominant-baseline="middle">Landscapes</text>

<polygon points="690,120.8 716.4,150 690,154.8 677.0,150" fill="#3b6ea5" fill-opacity="0.18" stroke="#3b6ea5" stroke-width="1.8"/>
<circle cx="690" cy="120.8" r="2.2" fill="#2c5580"/>
<circle cx="716.4" cy="150" r="2.2" fill="#2c5580"/>
<circle cx="690" cy="154.8" r="2.2" fill="#2c5580"/>
<circle cx="677.0" cy="150" r="2.2" fill="#2c5580"/>

<text x="690" y="238" fill="#7a7973" font-size="10" font-style="italic" text-anchor="middle">regeneration at the center</text>
</svg>
