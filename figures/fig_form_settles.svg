<svg xmlns="http://www.w3.org/2000/svg" width="1106" height="372" viewBox="0 0 1106 372" role="img">
<title>How a form settles</title>
<desc>The nine design pressures enter at the left, each in the colour of the direction it pushes. Build cost and energy yield run straight through three constrictions, marked permitting, value engineering, and the last round of cost cutting, because they are rarely the ones that give way. The other seven converge into the constrictions as faint threads and one solid line comes out, drawn without saying which, because a form needs only one of them to last the whole way. Where that one arrives, the project settles into an archetype, drawn as a table over vegetated ground. Where it does not, only cost and yield are left, and the result is the same array anywhere, drawn as the same table over gravel.</desc>
