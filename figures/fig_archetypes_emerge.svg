<svg xmlns="http://www.w3.org/2000/svg" width="1106" height="470" viewBox="0 0 1106 470" role="img">
<title>How an archetype emerges</title>
<desc>Many individual projects enter at the left as separate threads and pass through six columns, one per design lever, each column offering a few settings. Above them the nine design pressures are drawn as two bands of nine segments, one band per region, the segment widths showing that a region weights the pressures differently. The early columns are spread across their settings and the later ones are not, so the threads bundle as they travel. By the far side they have collected into four thick bundles, each a form that keeps recurring: regenerative solar grazing, retired-irrigation solar, solar prairie strips, and vegetable agrivoltaics. Threads from the arid region and the humid region are drawn in two tones, and the two do not fill the same bundles.</desc>
