<svg xmlns="http://www.w3.org/2000/svg" width="1106" height="356" viewBox="0 0 1106 356" role="img">
<title>How an archetype emerges</title>
<desc>A grid. Each column is one project and each row is one of the six design levers, so a column is the whole set of decisions a project made. A cell is shaded by which setting the lever was given, light for the low end and dark for the high end. Sorted this way, the columns fall into four blocks of near-identical shading, and each block is a form that keeps recurring: regenerative solar grazing, retired-irrigation solar, solar prairie strips, and vegetable agrivoltaics. The scale and siting rows carry the codes those blocks share. A strip above each column marks whether the project sits in an arid or a humid region, and the blocks are not evenly filled from the two.</desc>
