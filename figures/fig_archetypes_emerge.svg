<svg xmlns="http://www.w3.org/2000/svg" width="1106" height="392" viewBox="0 0 1106 392" role="img">
<title>How an archetype emerges</title>
<desc>A curve read like a potential-energy landscape. The vertical axis is design tension, highest at the top. The horizontal axis is the design pressures, where a position along it is one way the nine can come out. The curve has four low spots, each named for the form that sits in it: regenerative solar grazing, retired-irrigation solar, solar prairie strips, and vegetable agrivoltaics, with the scale and siting code each carries. Projects are drawn as balls resting at the bottom of the low spots. A second dashed curve shows the same landscape where the region is arid: the retired irrigation basin deepens and the prairie strips basin flattens almost away.</desc>
