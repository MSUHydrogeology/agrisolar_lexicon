<svg xmlns="http://www.w3.org/2000/svg" width="1106" height="426" viewBox="0 0 1106 426" role="img">
<title>How an archetype emerges</title>
<desc>Two landscapes, one above the other, drawn like a potential-energy curve. Each has four basins at the same four positions along it, and each basin is a combination of the six design levers that holds together: regenerative solar grazing, retired-irrigation solar, solar prairie strips, and vegetable agrivoltaics. Projects are drawn as balls that have rolled to the bottom of a basin. The upper landscape is an arid region and the lower one is humid. The same four basins exist in both, but not at the same depth: retired irrigation is the deepest basin in the arid landscape and is nearly flat in the humid one, while solar prairie strips is the reverse. A basin that flattens holds almost nothing.</desc>
