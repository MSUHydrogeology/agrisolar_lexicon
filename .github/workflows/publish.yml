name: Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress ones.
# The group is keyed per pull request and per branch, so that a push to main
# cancels only the previous main run. A single shared group meant any push to
# main also cancelled the build check running on an open pull request, and
# branch protection requires that check to pass before the PR can merge.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install rsvg-convert (embeds the SVG figures into the PDF)
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      # GH_TOKEN authenticates the TinyTeX release lookup. Without it the
      # installer queries the GitHub API anonymously and intermittently gets
      # "403 - Forbidden / Unable to determine latest release for
      # rstudio/tinytex-releases" when the runner's shared IP is rate-limited.
      # That failure has nothing to do with the book, but it fails the build
      # check that pull requests must pass.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true   # LaTeX for the PDF download

      - name: Render (HTML + PDF)
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploy only for pushes to main (a merged PR is a push to main).
  # Pull requests run the build job above as a render check but do not deploy.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
